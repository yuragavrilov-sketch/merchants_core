server:
  port: ${SERVER_PORT:8082}

pay:
  environment: ${PAY_ENVIRONMENT:local}

spring:
  application:
    name: merchants-core
  profiles:
    default: local
  config:
    import:
      - optional:configserver:${CONFIG_SERVER_URL:http://pay-payconfig-server:8080}
      - optional:vault://
  datasource:
    url: ${ORACLE_DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${ORACLE_DB_USERNAME:payments}
    # password is NOT declared here: it comes from Vault (kv context merchants-core-db-password ->
    # spring.datasource.password) in deployed envs, from application-local.yml for local dev, and from
    # the H2 test override for unit tests. (Keeps the secret env-var convention out of application.yml.)
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  cloud:
    config:
      enabled: ${CONFIG_SERVER_ENABLED:false}
      label: ${CONFIG_SERVER_LABEL:${pay.environment}}
      username: ${CONFIG_CLIENT_USERNAME:}
      password: ${CONFIG_CLIENT_PASSWORD:}
    vault:
      enabled: ${VAULT_ENABLED:false}
      kv:
        backend: ${VAULT_KV_BACKEND:pay}
        default-context: ""
        application-name: ${VAULT_KV_CONTEXTS:${pay.environment}/${spring.application.name}-db-password,${pay.environment}/sbp-router-admin-key,${pay.environment}/payadmin-bff-internal-key}
        profiles: []

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

merchants-core:
  internal-admin:
    header-name: ${INTERNAL_ADMIN_API_KEY_HEADER:X-Internal-Admin-Key}
    # Модель «один ключ = идентичность caller'а»: имя caller'а -> его ключ.
    accepted-callers:
      payadmin-bff: ${payadmin-bff.internal-key:}
    # legacy общий ключ (dual-accept на время миграции на per-caller) — убрать после cutover.
    api-key: ${sbp-router.admin-key:${INTERNAL_ADMIN_API_KEY:}}
